<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1b3a6b" />
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="시험 모드" />
  <title>감독관 · 오프라인 검증</title>
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="stylesheet" href="/src/proctor.css" />
</head>
<body>
  <div class="mock-banner">모의 시스템 · 실제 모바일신분증과 연결되지 않음</div>
  <header class="page-header"><a href="./index.html">← 처음</a><h1>감독관</h1></header>

  <!-- 감독관 기기 시각 · 네트워크 상태 -->
  <div class="status-bar">
    <div><span class="small">감독관 기기 시각</span><strong id="clock">--:--:--</strong></div>
    <span class="net-chip" id="net-chip"></span>
  </div>

  <main>
    <p class="eyebrow">QR 스캔</p>
    <h2>응시자 QR을 비춰 주세요</h2>
    <p class="lead">발급기관 공개키와 담당 시험실 정보만으로 이 기기 안에서 검증합니다.</p>

    <!-- 담당 시험실: 신분증의 시험명·시험장소와 비교 -->
    <section class="room-card">
      <div class="room-view" id="room-view" hidden>
        <div><span class="small">담당 시험실</span><strong id="room-text"></strong></div>
        <button class="link-btn" id="room-edit" type="button">변경</button>
      </div>
      <form class="form" id="room-form" hidden>
        <p class="small">맡은 시험명과 시험장소를 응시자 등록 때와 같게 입력하세요. 띄어쓰기는 달라도 됩니다.</p>
        <label class="field"><span>시험명</span><input name="examName" required maxlength="30" placeholder="예) 2026학년도 2학기 기말고사" /></label>
        <label class="field"><span>시험장소</span><input name="venue" required maxlength="30" placeholder="예) 대전대신고 2학년 3반 교실" /></label>
        <button class="btn" type="submit">저장하고 스캔 시작</button>
      </form>
    </section>

    <div class="reader-box">
      <video id="camera" playsinline muted autoplay></video>
      <!-- 이 테두리 안쪽만 해독한다 (lib/scanner.js의 CROP과 같은 영역) -->
      <div class="scan-guide"></div>
      <div class="reader-msg" id="reader-msg" hidden></div>
    </div>
    <p class="scan-tip">응시자 폰 밝기를 최대로 · QR이 테두리를 꽉 채우도록 15~20cm 거리에서 비추세요</p>
    <button class="btn" id="camera-btn" hidden>카메라 시작</button>

    <section class="log">
      <div class="log-head">
        <h3>확인 기록</h3>
        <span class="small" id="log-count"></span>
      </div>
      <ul class="log-list" id="log-list"></ul>
      <button class="btn secondary" id="clear-btn">시험 종료 · 기록 삭제</button>
      <p class="notice" id="clear-msg" hidden></p>
    </section>
  </main>

  <!-- 판정 결과 (화면 전체) -->
  <div class="result-screen" id="result" hidden>
    <div class="result-inner">
      <p class="result-title" id="result-title"></p>
      <p class="result-detail" id="result-detail"></p>
      <ul class="check-list" id="check-list"></ul>
      <div id="result-body"></div>
      <button class="btn" id="rescan-btn">다시 스캔</button>
      <div class="auto-close"><i id="auto-bar"></i></div>
      <p class="auto-hint" id="auto-hint">3초 뒤 스캔 대기로 돌아갑니다 · 화면을 누르면 멈춤</p>
    </div>
  </div>

  <script type="module" src="/src/pages/proctor.js"></script>
</body>
</html>
