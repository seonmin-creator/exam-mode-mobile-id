    <a class="role-link" href="./proctor.html">
      <div class="role-icon">감</div>
      <div><strong>감독관</strong><span>QR 스캔 · 오프라인 본인확인</span></div>
    </a>

    <a class="role-link" href="./test.html">
      <div class="role-icon">T</div>
      <div><strong>테스트 도구</strong><span>위조·캡처 QR 시험 · 데이터 초기화</span></div>
    </a>

    <p class="small">공모전 시연용 프로토타입입니다. 모든 인물과 데이터는 가상입니다.</p>
